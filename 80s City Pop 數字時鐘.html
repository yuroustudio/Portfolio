<!DOCTYPE html>
<html lang="zh-TW">
<head>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Righteous&family=Share+Tech+Mono&family=Outfit:wght@600;800&family=Noto+Sans+TC:wght@300;400;600;700;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            user-select: none;
            overflow: hidden;
            background-color: #0d0221;
        }

        /* 3 Distinct 80s City Pop Font Styles */
        .font-style-synth {
            font-family: 'Righteous', cursive;
            letter-spacing: 0.06em;
        }

        .font-style-tech {
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 0.08em;
        }

        .font-style-retro {
            font-family: 'Share Tech Mono', monospace;
            letter-spacing: 0.04em;
        }

        /* Smooth Crossfade for Vector Art Layers */
        .bg-layer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            transition: opacity 1.8s ease-in-out, transform 1.8s ease-in-out;
            background-size: cover;
            background-position: center;
        }

        .bg-hidden {
            opacity: 0;
            transform: scale(1.04);
            pointer-events: none;
        }

        .bg-visible {
            opacity: 1;
            transform: scale(1);
        }

        /* Glassmorphism Buttons */
        .glass-btn {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            transition: all 0.25s ease;
        }

        .glass-btn:hover {
            background: rgba(255, 0, 128, 0.25);
            border-color: rgba(0, 240, 255, 0.6);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
            transform: translateY(-2px);
        }

        .glass-btn:active {
            transform: translateY(0);
        }

        /* Multi-layered High-Contrast Neon Glow for Floating Digits */
        .neon-glow-pink {
            text-shadow: 
                0 0 10px #ff2a8d,
                0 0 20px #ff2a8d,
                0 0 40px #ff007f,
                0 0 80px #b000ff,
                0 0 120px rgba(0, 0, 0, 0.9);
        }

        .neon-glow-cyan {
            text-shadow: 
                0 0 8px #00f0ff,
                0 0 18px #00f0ff,
                0 0 35px #00a2ff,
                0 0 70px rgba(0, 0, 0, 0.9);
        }

        /* Ambient floating effect for floating clock text */
        @keyframes subtleFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        .animate-float {
            animation: subtleFloat 6s ease-in-out infinite;
        }

        /* Audio Disk Spinning Indicator */
        @keyframes spinSlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .spin-music {
            animation: spinSlow 4s linear infinite;
        }
    </style>
</head>

                    <rect x="0" y="580" width="1920" height="500" fill="#0a0214" />

                    <!-- Water Glow Lines -->
                    <line x1="300" y1="640" x2="600" y2="640" stroke="#ff79c6" stroke-width="3" opacity="0.8" />
                    <line x1="200" y1="720" x2="700" y2="720" stroke="#ff79c6" stroke-width="4" opacity="0.6" />

            },
            {
                id: 7,
                title: "落日公路與夕陽丘陵",
                desc: "熱帶公路直通遠方漸層夕陽，溫暖迷幻的 80 年代景色",
                svg: `
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" class="w-full h-full object-cover">
                    <defs>
                        <linearGradient id="cp7_bg" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#ff758c" />
                            <stop offset="100%" stop-color="#ff7eb3" />
                        </linearGradient>
                    </defs>
                    <rect width="100%" height="100%" fill="url(#cp7_bg)" />
                    <circle cx="960" cy="500" r="200" fill="#ffea79" />
                    <!-- Hills -->
                    <path d="M0,650 Q450,520 960,650 T1920,650 L1920,1080 L0,1080 Z" fill="#2b0036" />
                </svg>
                `
            },
            {
                id: 8,
                title: "棕櫚渡假村夜色",
                desc: "泳池波光與霓虹粉光倒影，優雅舒適的夏日夜派對",
                svg: `
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" class="w-full h-full object-cover">
                    <defs>
                        <linearGradient id="cp8_bg" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#02111b" />
                            <stop offset="100%" stop-color="#3f2b96" />
                        </linearGradient>
                    </defs>
                    <rect width="100%" height="100%" fill="url(#cp8_bg)" />
                    <polygon points="0,680 1920,680 1920,1080 0,1080" fill="#00e5ff" opacity="0.3" />
                    <path d="M0,680 L1920,680" stroke="#00f0ff" stroke-width="4" />
                </svg>
                `
            },
            {
                id: 9,
                title: "新宿雨後霓虹招牌",
                desc: "繁華街頭倒影與日系霓虹招牌堆疊出的微醺氛圍",
                svg: `
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" class="w-full h-full object-cover">
                    <defs>
                        <linearGradient id="cp9_bg" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#080014" />
                            <stop offset="100%" stop-color="#1f002b" />
                        </linearGradient>
                    </defs>
                    <rect width="100%" height="100%" fill="url(#cp9_bg)" />
                    <!-- Vertical Neon Signboard Blocks -->
                    <rect x="250" y="150" width="80" height="400" fill="#ff0055" opacity="0.8" rx="10" />
                    <rect x="360" y="220" width="70" height="300" fill="#00f0ff" opacity="0.8" rx="10" />
                    <rect x="1500" y="180" width="90" height="420" fill="#ffe600" opacity="0.8" rx="10" />
                    <rect x="1620" y="260" width="70" height="320" fill="#a855f7" opacity="0.8" rx="10" />
                    <!-- Wet Ground Reflection -->
                    <rect x="0" y="700" width="1920" height="380" fill="#05000a" />
                    <ellipse cx="290" cy="880" rx="120" ry="15" fill="#ff0055" opacity="0.4" />
                    <ellipse cx="395" cy="850" rx="90" ry="12" fill="#00f0ff" opacity="0.4" />
                    <ellipse cx="1545" cy="890" rx="130" ry="16" fill="#ffe600" opacity="0.4" />
                </svg>
                `
            },
            {
                id: 10,
                title: "Outrun 無限網格地平線",
                desc: "極速跑車視角，衝向無限延伸的 80s 賽博金屬網格",
                svg: `
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" class="w-full h-full object-cover">
                    <defs>
                        <linearGradient id="cp10_bg" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#140024" />
                            <stop offset="50%" stop-color="#420042" />
                            <stop offset="100%" stop-color="#ff0066" />
                        </linearGradient>
                    </defs>
                    <rect width="100%" height="100%" fill="url(#cp10_bg)" />
                    <polygon points="0,600 1920,600 1920,1080 0,1080" fill="#0a0014" />
                    <line x1="0" y1="600" x2="1920" y2="600" stroke="#00f0ff" stroke-width="4" />
                </svg>
                `
            },
            {
                id: 11,
                title: "黃昏濱海大道長廊",
                desc: "金黃與粉紫交織的微風夕照，沿著海岸延伸的路燈長廊",
                svg: `
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" class="w-full h-full object-cover">
                    <defs>
                        <linearGradient id="cp11_bg" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#f97316" />
                            <stop offset="50%" stop-color="#ec4899" />
                            <stop offset="100%" stop-color="#3b0764" />
                        </linearGradient>
                    </defs>
                    <rect width="100%" height="100%" fill="url(#cp11_bg)" />
                    <circle cx="960" cy="520" r="160" fill="#fef08a" />
                    <path d="M0,660 Q480,630 960,660 T1920,660 L1920,1080 L0,1080 Z" fill="#1e1b4b" />
                </svg>
                `
            },
            {
                id: 12,
                title: "星穹土星與霓虹幻境",
                desc: "夢幻蒸氣波宇宙，巨大的星環與夜光海面相呼應",
                svg: `
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" class="w-full h-full object-cover">
                    <defs>
                        <linearGradient id="cp12_bg" x1="0%" y1="0%" x2="0%" y2="100%">
                            <stop offset="0%" stop-color="#030712" />
                            <stop offset="60%" stop-color="#1e1035" />
                            <stop offset="100%" stop-color="#3b0764" />
                        </linearGradient>
                    </defs>
                    <rect width="100%" height="100%" fill="url(#cp12_bg)" />
                    <!-- Giant Planet with Rings -->
                    <ellipse cx="1300" cy="320" rx="220" ry="40" fill="none" stroke="#38bdf8" stroke-width="8" transform="rotate(-15 1300 320)" opacity="0.7" />
                    <circle cx="1300" cy="320" r="110" fill="#c084fc" />
                    <!-- Water -->
                    <rect x="0" y="650" width="1920" height="430" fill="#090314" />
                    <path d="M0,650 L1920,650" stroke="#c084fc" stroke-width="3" />
                </svg>
                `
            }
        ];

        let currentIndex = 0;
        let activeLayer = 'A';
        let is24Hour = true;
        let lastMinute = -1;
        let isMusicPlaying = false;

        // Font options configuration
        const fontOptions = [
            { id: 'font-style-synth', name: '霓虹流行', fontName: 'Righteous' },
            { id: 'font-style-tech', name: '科技未來', fontName: 'Orbitron' },
            { id: 'font-style-retro', name: '復古數字', fontName: 'Share Tech Mono' }
        ];
        let currentFontIndex = 0;

        // DOM elements
        const bgMusic = document.getElementById('bgMusic');
        const bgLayerA = document.getElementById('bgLayerA');
        const bgLayerB = document.getElementById('bgLayerB');
        const sceneTitle = document.getElementById('sceneTitle');
        const sceneCounter = document.getElementById('sceneCounter');
        
        const clockContainer = document.getElementById('clockContainer');
        const clockHours = document.getElementById('clockHours');
        const clockMinutes = document.getElementById('clockMinutes');
        const clockSeconds = document.getElementById('clockSeconds');
        const ampmDisplay = document.getElementById('ampmDisplay');
        const dateDisplay = document.getElementById('dateDisplay');
        const dayDisplay = document.getElementById('dayDisplay');
        const countdownText = document.getElementById('countdownText');
        const minuteProgressBar = document.getElementById('minuteProgressBar');
        const fontBtn = document.getElementById('fontBtn');
        const fontLabel = document.getElementById('fontLabel');

        const galleryModal = document.getElementById('galleryModal');
        const galleryGrid = document.getElementById('galleryGrid');
        const toast = document.getElementById('toast');
        const toastMessage = document.getElementById('toastMessage');

        function setBackground(index, isUserAction = false) {
            currentIndex = index;
            const data = cityPopIllustrations[currentIndex];

            const targetLayer = activeLayer === 'A' ? bgLayerB : bgLayerA;
            const currentLayer = activeLayer === 'A' ? bgLayerA : bgLayerB;

            targetLayer.innerHTML = data.svg;
            
            targetLayer.classList.remove('bg-hidden');
            targetLayer.classList.add('bg-visible');
            
            currentLayer.classList.remove('bg-visible');
            currentLayer.classList.add('bg-hidden');

            activeLayer = activeLayer === 'A' ? 'B' : 'A';

            // Update UI Labels
            sceneTitle.innerText = data.title;
            sceneCounter.innerText = `${currentIndex + 1} / ${cityPopIllustrations.length}`;

            updateGallerySelection();

            if (isUserAction) {
                showToast(`已切換：${data.title}`);
            }
        }

        function updateClock() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes();
            const seconds = now.getSeconds();
            const milliseconds = now.getMilliseconds();

            // Handle 12 / 24 Hour Format
            let displayHours = hours;
            if (!is24Hour) {
                displayHours = hours % 12 || 12;
                ampmDisplay.innerText = hours >= 12 ? 'PM' : 'AM';
                ampmDisplay.classList.remove('hidden');
            } else {
                ampmDisplay.classList.add('hidden');
            }

            // Pad zeros
            clockHours.innerText = String(displayHours).padStart(2, '0');
            clockMinutes.innerText = String(minutes).padStart(2, '0');
            clockSeconds.innerText = String(seconds).padStart(2, '0');

            // Date Formatting
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const date = String(now.getDate()).padStart(2, '0');
            const daysInChinese = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
            
            dateDisplay.innerText = `${year} 年 ${month} 月 ${date} 日`;
            dayDisplay.innerText = daysInChinese[now.getDay()];

            // Minute Progress Bar & Countdown
            const secondsRemaining = 60 - seconds;
            countdownText.innerText = secondsRemaining;
            const progressPercent = ((seconds + milliseconds / 1000) / 60) * 100;
            minuteProgressBar.style.width = `${progressPercent}%`;

            // Detect Minute Change -> Trigger Background Change
            if (lastMinute !== -1 && minutes !== lastMinute) {
                const nextIdx = (currentIndex + 1) % cityPopIllustrations.length;
                setBackground(nextIdx);
            }
            lastMinute = minutes;
        }

        function toggleMusic() {
            const musicBtn = document.getElementById('musicBtn');
            const musicIcon = document.getElementById('musicIcon');
            const musicLabel = document.getElementById('musicLabel');
            const musicDiscIcon = document.getElementById('musicDiscIcon');

            if (!isMusicPlaying) {
                bgMusic.play().then(() => {
                    isMusicPlaying = true;
                    musicIcon.className = 'fa-solid fa-compact-disc text-pink-400 spin-music';
                    musicDiscIcon.classList.add('spin-music');
                    musicLabel.innerText = '背景音樂 : ON';
                    musicBtn.classList.add('border-pink-400', 'bg-pink-500/20');
                    showToast("已播放 80s City Pop 背景音樂");
                }).catch(err => {
                    showToast("無法自動播放，請檢查瀏覽器設定");
                });
            } else {
                bgMusic.pause();
                isMusicPlaying = false;
                musicIcon.className = 'fa-solid fa-music text-pink-400';
                musicDiscIcon.classList.remove('spin-music');
                musicLabel.innerText = '背景音樂 : OFF';
                musicBtn.classList.remove('border-pink-400', 'bg-pink-500/20');
                showToast("已暫停背景音樂");
            }
        }

        function initGallery() {
            galleryGrid.innerHTML = '';
            cityPopIllustrations.forEach((item, idx) => {
                const card = document.createElement('div');
                card.className = `gallery-item group relative rounded-xl overflow-hidden cursor-pointer border-2 transition-all duration-300 h-32 md:h-40 ${idx === currentIndex ? 'border-pink-400 scale-[1.02] shadow-lg shadow-pink-500/30' : 'border-white/10 hover:border-white/40'}`;
                
                card.innerHTML = `
                    <div class="absolute inset-0 pointer-events-none">${item.svg}</div>
                    <div class="absolute inset-0 bg-gradient-to-t from-slate-950/90 via-slate-950/30 to-transparent opacity-80 group-hover:opacity-60 transition"></div>
                    <div class="absolute bottom-0 left-0 right-0 p-2.5 text-left">
                        <div class="text-xs font-extrabold text-white truncate">${item.title}</div>
                        <div class="text-[10px] text-pink-200/70 truncate">${item.desc}</div>
                    </div>
                `;

                card.addEventListener('click', () => {
                    setBackground(idx, true);
                    closeGallery();
                });

                galleryGrid.appendChild(card);
            });
        }

        function updateGallerySelection() {
            const items = galleryGrid.querySelectorAll('.gallery-item');
            items.forEach((item, idx) => {
                if (idx === currentIndex) {
                    item.className = 'gallery-item group relative rounded-xl overflow-hidden cursor-pointer border-2 transition-all duration-300 h-32 md:h-40 border-pink-400 scale-[1.02] shadow-lg shadow-pink-500/30';
                } else {
                    item.className = 'gallery-item group relative rounded-xl overflow-hidden cursor-pointer border-2 transition-all duration-300 h-32 md:h-40 border-white/10 hover:border-white/40';
                }
            });
        }

        // Toast Notification Helper
        let toastTimeout;
        function showToast(msg) {
            toastMessage.innerText = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 3000);
        }

        // Fullscreen Toggle
        function toggleFullscreen() {
            const icon = document.getElementById('fullscreenIcon');
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    showToast("無法開啟全螢幕");
                });
                icon.className = 'fa-solid fa-compress text-base';
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
                icon.className = 'fa-solid fa-expand text-base';
            }
        }

        function openGallery() {
            galleryModal.classList.remove('opacity-0', 'pointer-events-none');
            galleryModal.classList.add('opacity-100');
        }

        function closeGallery() {
            galleryModal.classList.remove('opacity-100');
            galleryModal.classList.add('opacity-0', 'pointer-events-none');
        }

        // Switch Font Logic
        function switchFont() {
            clockContainer.classList.remove(fontOptions[currentFontIndex].id);
            currentFontIndex = (currentFontIndex + 1) % fontOptions.length;
            const selectedFont = fontOptions[currentFontIndex];

            clockContainer.classList.add(selectedFont.id);
            fontLabel.innerText = selectedFont.name;

            showToast(`已切換字體：${selectedFont.name}`);
        }

        document.getElementById('prevBgBtn').addEventListener('click', () => {
            const prevIdx = (currentIndex - 1 + cityPopIllustrations.length) % cityPopIllustrations.length;
            setBackground(prevIdx, true);
        });

        document.getElementById('nextBgBtn').addEventListener('click', () => {
            const nextIdx = (currentIndex + 1) % cityPopIllustrations.length;
            setBackground(nextIdx, true);
        });

        fontBtn.addEventListener('click', switchFont);

        document.getElementById('formatBtn').addEventListener('click', (e) => {
            is24Hour = !is24Hour;
            e.target.innerText = is24Hour ? '24H' : '12H';
            showToast(`已切換為 ${is24Hour ? '24' : '12'} 小時制`);
            updateClock();
        });

        document.getElementById('musicBtn').addEventListener('click', toggleMusic);
        document.getElementById('fullscreenBtn').addEventListener('click', toggleFullscreen);
        document.getElementById('galleryToggleBtn').addEventListener('click', openGallery);
        document.getElementById('closeGalleryBtn').addEventListener('click', closeGallery);

        galleryModal.addEventListener('click', (e) => {
            if (e.target === galleryModal) closeGallery();
        });

        // Keyboard Shortcut Keys (Left/Right Arrows, F Key)
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') {
                const nextIdx = (currentIndex + 1) % cityPopIllustrations.length;
                setBackground(nextIdx, true);
            } else if (e.key === 'ArrowLeft') {
                const prevIdx = (currentIndex - 1 + cityPopIllustrations.length) % cityPopIllustrations.length;
                setBackground(prevIdx, true);
            } else if (e.key === 'f' || e.key === 'F') {
                toggleFullscreen();
            }
        });

        // Initialization on Load
        window.addEventListener('DOMContentLoaded', () => {
            setBackground(0);
            initGallery();
            updateClock();
            setInterval(updateClock, 200);
        });
    </script>
</body>
